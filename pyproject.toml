[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-watcher"
version = "0.3.0"
description = "Runtime observation, Proof of Execution and OS-enforced containment for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The Watcher contributors" }]
keywords = ["ai-safety", "proof-of-execution", "audit", "tripwire", "kill-switch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Intentionally empty: The Watcher is standard-library only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
watcher = "the_watcher.cli:main"

[tool.setuptools.packages.find]
include = ["the_watcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    # The only tests that need OS-enforced containment, and therefore the only
    # ones that need Linux with unprivileged user namespaces plus seccomp.
    # CI runs them in a dedicated ubuntu-22.04 job and deselects them
    # everywhere else with `-m "not v3"`, because on a runner that cannot
    # contain, backend selection falls back to Docker and cannot start a
    # container - which fails for runner-environment reasons rather than
    # Watcher defects.
    "v3: OS-enforced containment tests (Linux only; run in the dedicated V3 job)",
]

[tool.ruff]
# Pin the oldest supported interpreter so Ruff flags anything that would not
# run there (a 3.11-only stdlib import, say). ``requires-python`` is >=3.10 and
# CI runs the suite on 3.10, so the two must agree.
target-version = "py310"

[tool.ruff.lint]
# Ruff's default rule set, written out. Leaving it implicit would let a future
# Ruff release redefine this project's quality gate without a commit here:
#   E4  imports
#   E7  statement-level issues (comparisons, redundant statements)
#   E9  runtime errors (syntax and evaluation problems)
#   F   Pyflakes (undefined names, unused imports and variables)
select = ["E4", "E7", "E9", "F"]
