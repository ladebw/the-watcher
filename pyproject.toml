[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-watcher"
version = "0.3.0"
description = "Runtime observation, Proof of Execution and OS-enforced containment for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The Watcher contributors" }]
keywords = ["ai-safety", "proof-of-execution", "audit", "tripwire", "kill-switch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Intentionally empty: The Watcher is standard-library only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
watcher = "the_watcher.cli:main"

[tool.setuptools.packages.find]
include = ["the_watcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
